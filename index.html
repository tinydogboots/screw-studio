<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Screw Studio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
  /* Layout: paper control panel on the left, dark "infinite grid" stage on the right.
     Type contrast: a light grotesk set huge and tight for display, tiny grotesk caps for labels,
     monospace only for numbers and values. Panel is deliberately light, stage deliberately dark. */
  :root{
    color-scheme: light;
    --paper:#f9f8f5; --ink:#333333; --ink-strong:#101010; --well:#efeee9; --muted:#8b887f; --rule:rgba(51,51,51,.85);
    --stage:#f2f2f2; --stage-ink:#111111; --stage-muted:rgba(17,17,17,.58);
    --mono:"JetBrains Mono", SFMono-Regular, Consolas, Menlo, monospace;
    --grot:"Inter Tight", "Helvetica Neue", Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--paper);color:var(--ink);font:12.5px/1.15 var(--mono);text-transform:uppercase;letter-spacing:.02em}
  button,select,input,option{font:inherit;color:inherit;text-transform:inherit;letter-spacing:inherit}
  button{background:none;border:0;padding:0;cursor:pointer;text-align:left}
  :focus-visible{outline:1px dotted var(--ink-strong);outline-offset:2px}

  #app{display:grid;grid-template-columns:300px minmax(0,1fr);height:100%}

  /* ---- control panel ---- */
  #panel{display:flex;flex-direction:column;min-height:0;border-right:1px dotted var(--rule);padding-left:env(safe-area-inset-left, 0px)}
  #controls{flex:1;overflow-y:auto;padding:6px 0 18px}
  .brand{padding:14px 10px 12px;border-bottom:1px dotted var(--rule);font-family:var(--grot)}
  .brand-big{display:block;font-weight:300;font-size:52px;line-height:.86;letter-spacing:-.055em;margin-left:-3px}
  .grp{margin-top:16px}
  .grp h3{display:flex;align-items:baseline;gap:6px;margin:0;font:300 21px/1 var(--grot);letter-spacing:-.035em;padding:0 8px;position:relative}
  .grp h3::after{content:"";flex:1;border-top:1px dotted var(--rule);order:1;margin:0 2px;align-self:center}
  .grp h3 span{background:var(--paper);order:0}
  .grp h3 .fold{order:2;width:14px;text-align:center;font:12px var(--mono);font-style:normal;letter-spacing:0}
  .row label,.check,.tools button,.frow > span:first-child,.exportbtn > span{font-family:var(--grot);font-size:11.5px;letter-spacing:.02em}
  .grp-body{background:var(--well);padding:2px 8px 6px;margin-top:6px}
  .grp.closed .grp-body{display:none}
  .row{padding-top:10px}
  .row .line{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
  .row label{flex:none}
  .num{display:inline-flex;align-items:baseline;gap:3px;min-width:0}
  .num input{width:7ch;background:none;border:0;padding:0;text-align:right;border-bottom:1px solid transparent}
  .num input:focus{outline:none;border-bottom:1px dotted var(--ink)}
  .unit{color:var(--muted);font-size:11px}
  select{appearance:none;-webkit-appearance:none;background:none;border:0;padding:0 0 1px;text-align:right;text-align-last:right;
    cursor:pointer;min-width:0;max-width:76%;text-overflow:ellipsis;text-decoration:underline dotted;text-underline-offset:3px}
  input[type=color]{-webkit-appearance:none;appearance:none;width:16px;height:16px;border:1px solid var(--ink);padding:0;background:none;cursor:pointer}
  input[type=color]::-webkit-color-swatch-wrapper{padding:0}
  input[type=color]::-webkit-color-swatch{border:0}
  input[type=color]::-moz-color-swatch{border:0}
  .check{display:block;width:100%;padding:0}
  .check:hover{color:var(--ink-strong)}
  .filebtn{max-width:62%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:11px var(--mono);text-transform:none;
    border:1px dotted var(--ink);border-radius:999px;padding:4px 10px 3px}
  .filebtn:hover{background:var(--ink);color:var(--paper);border-style:solid}

  input[type=range]{-webkit-appearance:none;appearance:none;display:block;width:100%;height:22px;margin:2px 0 0;background:transparent;cursor:pointer}
  input[type=range]::-webkit-slider-runnable-track{height:1px;background:rgba(51,51,51,.45)}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:1px;height:10px;margin-top:-4.5px;background:var(--ink);border:0;border-radius:0;
    box-shadow:0 0 0 3px transparent}
  input[type=range]:hover::-webkit-slider-runnable-track,input[type=range]:focus::-webkit-slider-runnable-track{background:var(--ink)}
  input[type=range]::-moz-range-track{height:1px;background:rgba(51,51,51,.45)}
  input[type=range]::-moz-range-thumb{width:1px;height:10px;background:var(--ink);border:0;border-radius:0}
  input[type=range]:focus{outline:none}
  input[type=range]:focus-visible::-webkit-slider-thumb{width:3px}

  .off{opacity:.35;pointer-events:none}

  footer{border-top:1px dotted var(--rule);padding:10px 8px calc(10px + env(safe-area-inset-bottom, 0px));display:flex;flex-direction:column;gap:10px;background:var(--paper)}
  .frow{display:flex;justify-content:space-between;align-items:baseline}
  .tools{gap:6px;justify-content:flex-start;padding-bottom:10px;border-bottom:1px dotted var(--rule)}
  .tools button{border:1px dotted var(--ink);border-radius:999px;padding:5px 11px 4px}
  .tools button:hover{background:var(--ink);color:var(--paper);border-style:solid}
  .fmt{display:flex;gap:12px}
  .fmt button{color:var(--muted)}
  .fmt button[aria-pressed="true"]{color:var(--ink-strong);text-decoration:underline;text-underline-offset:3px}
  .exportbtn{display:flex;justify-content:space-between;align-items:center;height:40px;padding:0 10px;background:var(--ink);color:var(--paper)}
  .exportbtn:hover{background:var(--ink-strong)}
  kbd{font:10px var(--mono);border:1px solid rgba(249,248,245,.45);padding:2px 4px}
  #status{min-height:14px;font-size:11px;color:var(--muted)}

  /* ---- canvas ---- */
  main{position:relative;min-width:0;min-height:0;background:var(--stage);color:var(--stage-ink)}
  main canvas{display:block;width:100%;height:100%}
  #label{position:absolute;left:22px;top:20px;pointer-events:none;max-width:calc(100% - 44px);font-family:var(--grot)}
  #label .kicker{display:block;font-weight:300;font-style:normal;font-size:21px;line-height:1;letter-spacing:-.035em}
  #label .big{display:block;font-weight:300;font-size:52px;line-height:.86;letter-spacing:-.055em;margin:.1em 0 0 -.03em;white-space:nowrap}
  #label .fine{display:block;font-size:10.5px;line-height:1.3;letter-spacing:.02em;margin-top:14px;max-width:36ch;color:var(--stage-muted)}
  #hint{position:absolute;right:max(18px, env(safe-area-inset-right, 0px));bottom:16px;color:var(--stage-muted);font:10.5px var(--grot);letter-spacing:.03em;pointer-events:none}
  #loading{position:absolute;inset:0;display:grid;place-items:center;color:var(--stage-muted)}

  @media (max-width:760px){
    #app{display:flex;flex-direction:column;height:auto}
    main{height:56vh;order:1;border-bottom:1px dotted var(--rule)}
    #panel{order:2;border:0;padding-right:env(safe-area-inset-right, 0px)}
    #controls{overflow:visible}
    #hint{display:none}
  }
</style>
<script>
  // If the 3D engine fails to start, say why on the loading screen instead of waiting forever.
  (function () {
    const show = msg => { const el = document.getElementById('loading'); if (el && !el.dataset.final) el.textContent = msg; };
    // only react to this page's own scripts, not errors from browser extensions
    addEventListener('error', e => {
      const ours = (e.target && e.target.tagName === 'SCRIPT') || (e.filename && (e.filename.startsWith(location.origin) || e.filename.includes('cdn.jsdelivr.net')));
      if (ours) show('3D engine failed to start: ' + (e.message || 'a script could not load') + '. Reload the page to try again.');
    }, true);
    setTimeout(() => show('The 3D engine is taking too long to load. Check your connection and reload the page.'), 15000);
  })();
</script>

<div id="app">
  <aside id="panel" aria-label="Controls">
    <div id="controls">
      <header class="brand">
        <span class="brand-big">Screw</span>
        <span class="brand-big">Studio</span>
      </header>
    </div>
    <footer>
      <div class="frow tools">
        <button type="button" id="fit">Fit view</button>
        <button type="button" id="random">Randomize</button>
        <button type="button" id="reset">Reset</button>
      </div>
      <div class="frow"><span>Output format</span>
        <span class="fmt"><button type="button" data-fmt="png" aria-pressed="true">PNG</button><button type="button" data-fmt="svg" aria-pressed="false">SVG</button><button type="button" data-fmt="stl" aria-pressed="false">STL</button></span></div>
      <button type="button" class="check" id="transparent">[ ] Transparent background</button>
      <button type="button" class="exportbtn" id="export"><span>Export</span><kbd>cmd + S</kbd></button>
      <div id="status" role="status"></div>
    </footer>
  </aside>
  <main>
    <div id="loading">Loading 3D engine…</div>
    <div id="label"></div>
    <div id="hint">Drag orbit · right-drag pan · scroll zoom</div>
  </main>
</div>

<script type="module">
// Full CDN URLs, no import map: the hosted viewer can load scripts before an import map,
// which makes the browser ignore it. These ESM builds all share one copy of three.
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/+esm';
import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js/+esm';
import { RoomEnvironment } from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/environments/RoomEnvironment.js/+esm';
import { STLExporter } from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/exporters/STLExporter.js/+esm';
import { LineSegments2 } from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/lines/LineSegments2.js/+esm';
import { LineSegmentsGeometry } from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/lines/LineSegmentsGeometry.js/+esm';
import { LineMaterial } from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/lines/LineMaterial.js/+esm';

/* ================= configuration ================= */
const HEADS = [['pan','Pan'],['button','Button'],['truss','Truss'],['cheese','Cheese'],['socket','Socket cap'],
  ['flat','Flat / countersunk'],['oval','Raised countersunk'],['hex','Hex'],['none','None (threaded rod)']];
const DRIVES = [['phillips','Phillips'],['pozidriv','Pozidriv'],['slotted','Slotted'],['hex','Hex socket'],
  ['torx','Torx / star'],['square','Square (Robertson)'],['custom','Custom image'],['none','None']];
const FINISHES = {
  steel:{name:'Bright steel',color:'#b9bdc3',metal:1,rough:0.30},
  stainless:{name:'Stainless',color:'#d8dbe0',metal:1,rough:0.18},
  zinc:{name:'Zinc plated',color:'#c6d2de',metal:1,rough:0.26},
  yellowzinc:{name:'Yellow zinc',color:'#d8bf6e',metal:1,rough:0.28},
  brass:{name:'Brass',color:'#d2a64c',metal:1,rough:0.22},
  copper:{name:'Copper',color:'#c77b4a',metal:1,rough:0.25},
  gold:{name:'Gold',color:'#e8c45c',metal:1,rough:0.14},
  titanium:{name:'Titanium',color:'#928b84',metal:1,rough:0.34},
  black:{name:'Black oxide',color:'#2b2c30',metal:0.75,rough:0.42},
  nylon:{name:'White nylon',color:'#e9e6df',metal:0,rough:0.55},
  custom:{name:'Custom colour',color:null,metal:0.9,rough:null},
};
const DEFAULTS = {
  showScrew:true, showNut:false,
  head:'pan', headScale:1, drive:'phillips', flange:false,
  engScale:70, engDepth:0.6, engRot:0, engInvert:false,
  d:6, length:30, threadLen:100, tip:'chamfer', pointLen:1.3,
  profile:'metric', autoPitch:true, pitch:1, threadScale:1, leftHand:false,
  runout:0, endScale:0.3,
  nutEdges:6, nutWidth:1.6, nutHeight:0.8, nutPos:70, clearance:0.05, nutChamfer:true,
  segments:96,
  projection:'perspective', focal:35, camAz:38, camEl:15, camRoll:0,
  rotX:0, rotY:0, rotZ:0,
  finish:'zinc', color:'#8fb4ff', rough:0.26,
  autoRotate:false, grid:false, wire:false, bg:'#f2f2f2',   // stage: 5% black, no grid for now
};
const PRESETS = {
  'Machine screw M4×16 · pan Phillips': {head:'pan',drive:'phillips',d:4,length:16,finish:'zinc'},
  'Socket cap M6×30 · hex socket':      {head:'socket',drive:'hex',d:6,length:30,threadLen:65,finish:'black'},
  'Hex bolt M12×60 with nut':           {head:'hex',drive:'none',d:12,length:60,threadLen:50,finish:'steel',flange:true,showNut:true,nutPos:72},
  'Wood screw 5×50 · countersunk Pozi': {head:'flat',drive:'pozidriv',d:5,length:50,threadLen:60,tip:'point',profile:'wood',finish:'yellowzinc'},
  'Deck screw 5×70 · Torx':             {head:'flat',drive:'torx',d:5,length:70,threadLen:65,tip:'point',pointLen:1.6,profile:'wood',finish:'black'},
  'Brass screw 4×25 · raised csk slot': {head:'oval',drive:'slotted',d:4,length:25,threadLen:70,tip:'point',profile:'wood',finish:'brass'},
  'Button head M8×20 · hex socket':     {head:'button',drive:'hex',d:8,length:20,finish:'stainless'},
  'Threaded rod M8×50 + nut':           {head:'none',d:8,length:50,finish:'zinc',showNut:true,nutPos:40},
  'Printable bolt 20 mm · chunky':      {head:'hex',d:20,length:40,pitch:4,autoPitch:false,threadScale:1.2,runout:1,endScale:0.2,
                                         finish:'nylon',showNut:true,nutPos:100,clearance:0.3,segments:64},
  'Nut only · M10 square':              {showScrew:false,showNut:true,d:10,nutEdges:4,nutWidth:1.7,nutHeight:0.9,finish:'stainless'},
};
const mm = v => (+v).toFixed(v < 10 ? 2 : 1).replace(/\.?0+$/, '');
const SCHEMA = [
  {section:'Generate'},
  {key:'showScrew', label:'Screw', type:'check'},
  {key:'showNut', label:'Nut', type:'check'},
  {section:'Head', group:'screw'},
  {key:'head', label:'Style', type:'select', options:HEADS},
  {key:'headScale', label:'Head size', type:'range', min:0.6, max:1.6, step:0.05, unit:'×'},
  {key:'drive', label:'Drive', type:'select', options:DRIVES},
  {key:'engImg', label:'Image', type:'file'},
  {key:'engScale', label:'Image size', type:'range', min:10, max:100, step:1, unit:'%'},
  {key:'engDepth', label:'Engrave depth', type:'range', min:0.05, max:5, step:0.05, unit:'mm'},
  {key:'engRot', label:'Image rotation', type:'range', min:-180, max:180, step:1, unit:'°'},
  {key:'engInvert', label:'Invert image', type:'check'},
  {key:'flange', label:'Flange / washer', type:'check'},
  {section:'Shank', group:'screw'},
  {key:'d', label:'Diameter', type:'range', min:1, max:40, step:0.5, unit:'mm'},
  {key:'length', label:'Length', type:'range', min:3, max:200, step:1, unit:'mm'},
  {key:'threadLen', label:'Threaded', type:'range', min:5, max:100, step:1, unit:'%'},
  {key:'tip', label:'Tip', type:'select', options:[['flat','Flat'],['chamfer','Chamfered'],['point','Pointed (spike)']]},
  {key:'pointLen', label:'Spike length', type:'range', min:0.3, max:4, step:0.05, unit:'×d'},
  {section:'Thread'},
  {key:'profile', label:'Profile', type:'select', options:[['metric','Metric 60°'],['wood','Wood / coarse'],['none','None (smooth)']]},
  {key:'autoPitch', label:'Standard pitch', type:'check'},
  {key:'pitch', label:'Pitch', type:'range', min:0.2, max:10, step:0.05, unit:'mm'},
  {key:'threadScale', label:'Thread depth', type:'range', min:0.3, max:1.6, step:0.05, unit:'×'},
  {key:'runout', label:'End taper', type:'range', min:0, max:5, step:0.25, unit:'turns'},
  {key:'endScale', label:'Taper to', type:'range', min:0, max:1, step:0.05, unit:'×'},
  {key:'leftHand', label:'Left-hand', type:'check'},
  {key:'segments', label:'Segments', type:'range', min:16, max:192, step:4, unit:''},
  {section:'Nut', group:'nut'},
  {key:'nutEdges', label:'Outside edges', type:'range', min:3, max:16, step:1, unit:''},
  {key:'nutWidth', label:'Across flats', type:'range', min:1.2, max:3, step:0.05, unit:'×d'},
  {key:'nutHeight', label:'Height', type:'range', min:0.3, max:2, step:0.05, unit:'×d'},
  {key:'nutPos', label:'Position', type:'range', min:0, max:100, step:1, unit:'%'},
  {key:'clearance', label:'Clearance', type:'range', min:0, max:1, step:0.01, unit:'mm'},
  {key:'nutChamfer', label:'Chamfered', type:'check'},
  {section:'Camera'},
  {key:'projection', label:'View', type:'select', options:[['perspective','Perspective'],['isometric','Isometric']]},
  {key:'focal', label:'Focal length', type:'range', min:4, max:400, step:1, unit:'mm', log:true},
  {key:'camAz', label:'Orbit', type:'range', min:-180, max:180, step:1, unit:'°', live:true},
  {key:'camEl', label:'Elevation', type:'range', min:-89, max:89, step:1, unit:'°', live:true},
  {key:'camRoll', label:'Roll', type:'range', min:-180, max:180, step:1, unit:'°', live:true},
  {section:'Placement & view'},
  {key:'rotX', label:'Rotate X', type:'range', min:-180, max:180, step:1, unit:'°'},
  {key:'rotY', label:'Rotate Y', type:'range', min:-180, max:180, step:1, unit:'°'},
  {key:'rotZ', label:'Rotate Z', type:'range', min:-180, max:180, step:1, unit:'°'},
  {key:'autoRotate', label:'Turntable', type:'check'},
];

/* ================= state ================= */
const STORE_KEY = 'screw-studio-v4';
const state = {...DEFAULTS};
try { const saved = JSON.parse(localStorage.getItem(STORE_KEY) || 'null');
  // turntable always starts off; it only spins when switched on in this visit
  if (saved) for (const k in DEFAULTS) if (!['autoRotate', 'grid', 'bg'].includes(k) && k in saved && typeof saved[k] === typeof DEFAULTS[k]) state[k] = saved[k]; } catch {}
if (!state.showScrew && !state.showNut) state.showScrew = true;

/* ================= UI ================= */
const inputs = {}, groups = {};
const ctl = document.getElementById('controls');
const mark = on => on ? '[*] ' : '[ ] ';
let activePreset = '';
let groupBody = ctl;
const touched = () => { activePreset = ''; };
for (const s of SCHEMA) {
  if (s.section) {
    const sec = document.createElement('section'); sec.className = 'grp';
    const h = document.createElement('h3');
    const t = document.createElement('span'); t.textContent = s.section;
    const fold = document.createElement('button'); fold.type = 'button'; fold.className = 'fold'; fold.textContent = '-';
    fold.setAttribute('aria-label', 'Collapse ' + s.section); fold.setAttribute('aria-expanded', 'true');
    fold.onclick = () => { const c = sec.classList.toggle('closed'); fold.textContent = c ? '+' : '-';
      fold.setAttribute('aria-expanded', String(!c)); fold.setAttribute('aria-label', (c ? 'Expand ' : 'Collapse ') + s.section); };
    h.append(t, fold);
    groupBody = document.createElement('div'); groupBody.className = 'grp-body';
    sec.append(h, groupBody); ctl.appendChild(sec);
    if (s.group) groups[s.group] = (groups[s.group] || []).concat(sec);
    continue;
  }
  const row = document.createElement('div'); row.className = 'row';
  const id = 'c_' + s.key;
  let el, num;
  if (s.type === 'check') {
    el = document.createElement('button'); el.type = 'button'; el.className = 'check'; el.id = id;
    el.setAttribute('role', 'switch');
    el.onclick = () => {
      state[s.key] = !state[s.key];
      if (!state.showScrew && !state.showNut) state[s.key === 'showScrew' ? 'showNut' : 'showScrew'] = true;
      touched(); syncUI(); schedule();
    };
    row.appendChild(el);
  } else if (s.type === 'file') {
    // image upload for the custom engraving
    const line = document.createElement('div'); line.className = 'line';
    const lab = document.createElement('label'); lab.htmlFor = id; lab.textContent = s.label;
    el = document.createElement('input'); el.type = 'file'; el.id = id; el.accept = 'image/png,image/jpeg,image/svg+xml,image/webp,image/gif'; el.hidden = true;
    const pick = document.createElement('button'); pick.type = 'button'; pick.className = 'filebtn'; pick.textContent = 'Choose file';
    pick.onclick = () => el.click();
    el.addEventListener('change', () => {
      const f = el.files && el.files[0]; if (!f) return;
      const rd = new FileReader();
      rd.onload = () => loadEngraving(rd.result, f.name, () => { state.drive = 'custom'; touched(); syncUI(); schedule(); });
      rd.readAsDataURL(f);
      el.value = '';
    });
    line.append(lab, pick, el); row.appendChild(line);
    s.pick = pick;
  } else {
    const line = document.createElement('div'); line.className = 'line';
    const lab = document.createElement('label'); lab.htmlFor = id; lab.textContent = s.label; line.appendChild(lab);
    if (s.type === 'select') {
      el = document.createElement('select');
      for (const [v, t] of s.options) el.add(new Option(t, v));
      line.appendChild(el);
    } else if (s.type === 'color') {
      el = document.createElement('input'); el.type = 'color'; line.appendChild(el);
    } else {
      const box = document.createElement('span'); box.className = 'num';
      num = document.createElement('input'); num.type = 'text'; num.inputMode = 'decimal'; num.id = id + '_n';
      num.setAttribute('aria-label', s.label + (s.unit ? ' (' + s.unit + ')' : ''));
      box.appendChild(num);
      if (s.unit) { const u = document.createElement('span'); u.className = 'unit'; u.textContent = s.unit; box.appendChild(u); }
      line.appendChild(box);
      el = document.createElement('input'); el.type = 'range';
      if (s.log) {   // logarithmic slider: even feel from 4 mm fisheye-wide to 400 mm telephoto
        const span = Math.log(s.max / s.min);
        s.toSlider = v => Math.round(1000 * Math.log(v / s.min) / span);
        s.fromSlider = t => Math.round(s.min * Math.exp(t / 1000 * span));
        Object.assign(el, {min:0, max:1000, step:1});
      } else Object.assign(el, {min:s.min, max:s.max, step:s.step});
      num.addEventListener('change', () => {
        let v = parseFloat(num.value); if (isNaN(v)) { syncUI(); return; }
        state[s.key] = Math.min(s.max, Math.max(s.min, v));

  renderer.setSize(stageW, stageH, false);
  const db = renderer.getDrawingBufferSize(new THREE.Vector2());
  nrmRT.setSize(db.x, db.y);
  edgeMat.uniforms.uTexel.value.set(1 / db.x, 1 / db.y);
  edgeMat.uniforms.uWide.value = Math.max(1, Math.round(LINE_PX * renderer.getPixelRatio() / 2));
  lineMat.resolution.set(stageW, stageH);
  // on wide stages, both cameras nudge the object right so the big caption on the left has room
  updatePersp(); updateOrtho();
}
new ResizeObserver(resize).observe(main);
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)');
renderer.setAnimationLoop(() => {
  controls.autoRotate = state.autoRotate && !reduceMotion.matches;
  controls.update();
  if (state.camRoll) { camera.rotateZ(THREE.MathUtils.degToRad(state.camRoll)); camera.updateMatrixWorld(); }
  renderFrame();
});

/* ================= export ================= */
const statusEl = document.getElementById('status');
const say = t => { statusEl.textContent = t; clearTimeout(say.t); say.t = setTimeout(() => statusEl.textContent = '', 3500); };
let downloadsCap;  // undefined = not resolved yet, null = not available (local file)
if (window.claude?.use) window.claude.use('downloads').then(d => downloadsCap = d).catch(() => downloadsCap = null);
else downloadsCap = null;

async function offerFile(filename, blob) {
  if (downloadsCap) {
    try { await downloadsCap.save({filename, data: blob}); say('Saved ' + filename); }
    catch (e) { say(e?.code === 'declined' ? 'Save cancelled' : 'Could not save: ' + (e?.message || e?.code || 'unknown error')); }
    return;
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  say('Saved ' + filename);
}

const CRC = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
function crc32(b) { let c = 0xFFFFFFFF; for (let i = 0; i < b.length; i++) c = CRC[(c ^ b[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
function zipOne(name, data) {           // single stored (uncompressed) file
  const nb = new TextEncoder().encode(name), crc = crc32(data), n = data.length;
  const lh = new DataView(new ArrayBuffer(30)), cd = new DataView(new ArrayBuffer(46)), end = new DataView(new ArrayBuffer(22));
  [[0,0x04034b50,4],[4,20,2],[6,0,2],[8,0,2],[10,0,2],[12,33,2],[14,crc,4],[18,n,4],[22,n,4],[26,nb.length,2],[28,0,2]]
    .forEach(([o,v,s]) => s === 4 ? lh.setUint32(o, v, true) : lh.setUint16(o, v, true));
  [[0,0x02014b50,4],[4,20,2],[6,20,2],[8,0,2],[10,0,2],[12,0,2],[14,33,2],[16,crc,4],[20,n,4],[24,n,4],[28,nb.length,2],
   [30,0,2],[32,0,2],[34,0,2],[36,0,2],[38,0,4],[42,0,4]].forEach(([o,v,s]) => s === 4 ? cd.setUint32(o, v, true) : cd.setUint16(o, v, true));
  const cdOff = 30 + nb.length + n, cdSize = 46 + nb.length;
  [[0,0x06054b50,4],[4,0,2],[6,0,2],[8,1,2],[10,1,2],[12,cdSize,4],[16,cdOff,4],[20,0,2]]
    .forEach(([o,v,s]) => s === 4 ? end.setUint32(o, v, true) : end.setUint16(o, v, true));
  return new Blob([lh, nb, data, cd, nb, end], {type:'application/zip'});
}

const fileBase = () => {
  const s = state, size = (s.profile === 'metric' ? 'M' : 'D') + s.d;
  return s.showScrew ? `screw-${size}x${s.length}-${s.head}${s.showNut ? '-with-nut' : ''}` : `nut-${size}-${s.nutEdges}sided`;
};
let exportFmt = 'png', transparent = false;
const transBtn = document.getElementById('transparent');
const syncExport = () => {
  transBtn.textContent = mark(transparent) + 'Transparent background';
  transBtn.setAttribute('aria-checked', String(transparent)); transBtn.setAttribute('role', 'switch');
  transBtn.hidden = exportFmt !== 'png';
  for (const b of document.querySelectorAll('.fmt button')) b.setAttribute('aria-pressed', String(b.dataset.fmt === exportFmt));
};
transBtn.onclick = () => { transparent = !transparent; syncExport(); };
for (const b of document.querySelectorAll('.fmt button')) b.onclick = () => { exportFmt = b.dataset.fmt; syncExport(); };
const isMac = /Mac|iPhone|iPad/.test(navigator.platform);
document.querySelector('#export kbd').textContent = isMac ? 'cmd + S' : 'ctrl + S';
const doExport = () => ({png: savePNG, svg: saveSVG, stl: saveSTL})[exportFmt]();
document.getElementById('export').onclick = doExport;
addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 's') { e.preventDefault(); doExport(); }
});
syncExport();

function savePNG() {
  const bg = scene.background, gv = grid.visible;
  if (transparent) { scene.background = null; grid.visible = false; }
  renderFrame();
  renderer.domElement.toBlob(b => { scene.background = bg; grid.visible = gv; offerFile(fileBase() + '.png', b); }, 'image/png');
}
/* Vector export as pure linework (hidden-line drawing of the current view):
   - outline: silhouette edges and open mesh borders (rims, tips), heavier stroke
   - detail:  creases sharper than ~20° (thread crests and roots, hex edges, drive recesses)
   Hidden portions are removed by testing sample points against a GPU depth render. */
function saveSVG() {
  say('Building SVG…');
  setTimeout(() => {
    try { offerFile(fileBase() + '.svg', new Blob([buildLinework()], {type: 'image/svg+xml'})); }
    catch (e) { say('Could not build SVG: ' + e.message); }
  }, 30);
}

function buildLinework() {
  const W = 1600, H = Math.round(1600 * main.clientHeight / main.clientWidth);
  const meshes = [];
  assembly.updateMatrixWorld(true);
  assembly.traverse(o => o.isMesh && !o.isLineSegments2 && meshes.push(o));

  // 1. depth buffer of the current view (window-space z per pixel)
  const rt = new THREE.WebGLRenderTarget(W, H, {type: THREE.FloatType});
  const depthMat = new THREE.ShaderMaterial({side: THREE.DoubleSide,
    vertexShader: 'void main(){ gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
    fragmentShader: 'void main(){ gl_FragColor = vec4(gl_FragCoord.z, 0.0, 0.0, 1.0); }'});
  const saved = {bg: scene.background, grid: grid.visible, floor: floor.visible, clear: renderer.getClearColor(new THREE.Color()), alpha: renderer.getClearAlpha()};
  const mats = meshes.map(m => m.material);
  meshes.forEach(m => m.material = depthMat);
  scene.background = null; grid.visible = false; floor.visible = false;
  renderer.setClearColor(new THREE.Color(1, 1, 1), 1);
  renderer.setRenderTarget(rt); renderer.clear(); renderer.render(scene, camera); renderer.setRenderTarget(null);
  const buf = new Float32Array(W * H * 4);
  renderer.readRenderTargetPixels(rt, 0, 0, W, H, buf);
  meshes.forEach((m, i) => m.material = mats[i]);
  scene.background = saved.bg; grid.visible = saved.grid; floor.visible = saved.floor;
  renderer.setClearColor(saved.clear, saved.alpha);
  rt.dispose(); depthMat.dispose();

  const near = camera.near, far = camera.far;
  const ortho = camera.isOrthographicCamera;
  const lin = ortho ? z => near + z * (far - near)          // orthographic depth is already linear
                    : z => (2 * near * far) / (far + near - (z * 2 - 1) * (far - near));
  const depthAt = (px, py) => {          // most distant depth in a 3x3 neighbourhood (lenient at silhouettes)
    let m = 0;
    for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
      const x = Math.min(W - 1, Math.max(0, px + dx)), y = Math.min(H - 1, Math.max(0, py + dy));
      m = Math.max(m, buf[(y * W + x) * 4]);
    }
    return m;
  };

  // 2. collect candidate edges per mesh
  const camPos = camera.position, viewDir = camera.getWorldDirection(new THREE.Vector3());
  const outline = [], detail = [];
  const cosCrease = Math.cos(THREE.MathUtils.degToRad(12));
  const va = new THREE.Vector3(), vb = new THREE.Vector3(), vc = new THREE.Vector3();
  for (const mesh of meshes) {
    const pos = mesh.geometry.attributes.position, idx = mesh.geometry.index;
    const nTri = (idx ? idx.count : pos.count) / 3;
    // weld vertices by position so edges are shared between neighbouring triangles
    const ids = new Map(), P = [];
    const vid = i => {
      const x = pos.getX(i), y = pos.getY(i), z = pos.getZ(i);
      const k = Math.round(x * 1e4) + ',' + Math.round(y * 1e4) + ',' + Math.round(z * 1e4);
      let v = ids.get(k);
      if (v === undefined) { v = P.length; ids.set(k, v); P.push(new THREE.Vector3(x, y, z).applyMatrix4(mesh.matrixWorld)); }
      return v;
    };
    const edges = new Map();   // key -> [a, b, n1, f1, n2, f2]
    for (let t = 0; t < nTri; t++) {
      const i0 = idx ? idx.getX(t * 3) : t * 3, i1 = idx ? idx.getX(t * 3 + 1) : t * 3 + 1, i2 = idx ? idx.getX(t * 3 + 2) : t * 3 + 2;
      const a = vid(i0), b = vid(i1), c = vid(i2);
      if (a === b || b === c || a === c) continue;
      va.subVectors(P[b], P[a]); vb.subVectors(P[c], P[a]);
      const n = new THREE.Vector3().crossVectors(va, vb);
      if (n.lengthSq() < 1e-14) continue;
      n.normalize();
      vc.copy(P[a]).add(P[b]).add(P[c]).multiplyScalar(1 / 3);
      // perspective: compare with the ray to the eye; orthographic: with the fixed view direction
      const facing = ortho ? n.dot(viewDir) < 0 : n.dot(vc.sub(camPos).negate()) > 0;
      for (const [u, w] of [[a, b], [b, c], [c, a]]) {
        const k = u < w ? u * 4194304 + w : w * 4194304 + u;
        const e = edges.get(k);
        if (!e) edges.set(k, [u, w, n, facing, null, null]);
        else if (!e[4]) { e[4] = n; e[5] = facing; }
      }
    }
    for (const e of edges.values()) {
      const A = P[e[0]], B = P[e[1]];
      if (e[4] && e[3] !== e[5]) outline.push([A, B]);       // silhouette only; detail comes from the drawn lines
    }
  }

  // 3. clip each edge to its visible runs in screen space
  const toScreen = v => { const p = v.clone().project(camera); return [(p.x * .5 + .5) * W, (1 - (p.y * .5 + .5)) * H, p.z * .5 + .5]; };
  const visibleRuns = list => {
    const runs = [];
    for (const [A, B] of list) {
      const a = toScreen(A), b = toScreen(B);
      const len = Math.hypot(b[0] - a[0], b[1] - a[1]);
      const n = Math.max(2, Math.ceil(len / 1.5) + 1);
      let run = null;
      for (let i = 0; i < n; i++) {
        const t = i / (n - 1);
        const x = a[0] + (b[0] - a[0]) * t, y = a[1] + (b[1] - a[1]) * t;
        // perspective-correct depth: interpolate in world space, then project
        const z = toScreen(va.copy(A).lerp(B, t))[2];
        const px = Math.floor(x), py = H - 1 - Math.floor(y);
        const inside = px >= 0 && px < W && py >= 0 && py < H;
        const zl = lin(z);
        const vis = inside && zl <= lin(depthAt(px, py)) * 1.004 + 0.002;
        if (vis) { if (!run) { run = []; runs.push(run); } run.push([x, y]); }
        else run = null;
      }
    }
    return runs.filter(r => r.length > 1).map(r => [r[0], r[r.length - 1]]);
  };

  // 4. chain touching segments into longer polylines, then write path data
  const toPath = segs => {
    const key = p => Math.round(p[0] * 4) + ',' + Math.round(p[1] * 4);
    const byPt = new Map(), used = new Uint8Array(segs.length);
    segs.forEach((s, i) => { for (const p of s) { const k = key(p); (byPt.get(k) || byPt.set(k, []).get(k)).push(i); } });
    const next = (pt) => { for (const i of byPt.get(key(pt)) || []) if (!used[i]) return i; return -1; };
    const f = v => (Math.round(v * 10) / 10);
    let d = '';
    for (let s = 0; s < segs.length; s++) {
      if (used[s]) continue;
      used[s] = 1;
      const line = [segs[s][0], segs[s][1]];
      for (let end = 0; end < 2; end++) {     // grow forward, then backward
        for (;;) {
          const tip = end ? line[0] : line[line.length - 1];
          const i = next(tip); if (i < 0) break;
          used[i] = 1;
          const [p, q] = segs[i], far = key(p) === key(tip) ? q : p;
          end ? line.unshift(far) : line.push(far);
        }
      }
      d += 'M' + f(line[0][0]) + ' ' + f(line[0][1]);
      for (let i = 1; i < line.length; i++) d += 'L' + f(line[i][0]) + ' ' + f(line[i][1]);
    }
    return d;
  };

  // detail: the same deliberate lines shown in the view (thread helix, plane lines, recess outline, hex edges)
  if (featureLines) for (const pl of featureLines.userData.polylines)
    for (let i = 0; i + 1 < pl.length; i++) detail.push([pl[i].clone().applyMatrix4(assembly.matrixWorld), pl[i + 1].clone().applyMatrix4(assembly.matrixWorld)]);
  const out = toPath(visibleRuns(outline)), det = toPath(visibleRuns(detail));
  return '<?xml version="1.0" encoding="UTF-8"?>\n'
    + `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">\n`
    + '<g fill="none" stroke="#000000" stroke-linecap="round" stroke-linejoin="round">\n'
    + `<g id="detail" stroke-width="1"><path d="${det}"/></g>\n`
    + `<g id="outline" stroke-width="1.2"><path d="${out}"/></g>\n`
    + '</g>\n</svg>\n';
}
function saveSTL() {
  if (featureLines) assembly.remove(featureLines);        // lines are not part of the solid
  const stl = new Uint8Array(new STLExporter().parse(assembly, {binary:true}).buffer);
  if (featureLines) assembly.add(featureLines);
  const name = fileBase() + '.stl';
  // Hosted pages can only hand out a fixed set of file types, so the STL ships inside a .zip there.
  if (downloadsCap) offerFile(fileBase() + '.stl.zip', zipOne(name, stl));
  else offerFile(name, new Blob([stl], {type:'model/stl'}));
}
document.getElementById('fit').onclick = fitView;
document.getElementById('reset').onclick = () => {
  Object.assign(state, DEFAULTS); activePreset = ''; syncUI(); rebuild(); fitView();
};
document.getElementById('random').onclick = () => {
  const pick = a => a[Math.floor(Math.random() * a.length)];
  Object.assign(state, {
    head: pick(HEADS.slice(0, 8))[0], drive: pick(DRIVES.slice(0, 6))[0], d: pick([3, 4, 5, 6, 8, 10, 12]),
    profile: pick(['metric', 'metric', 'wood']), threadLen: pick([100, 100, 70, 60]), autoPitch: true,
    threadScale: 1, runout: 0, finish: pick(Object.keys(FINISHES).filter(k => k !== 'custom')),
    flange: Math.random() < 0.2, showScrew: true, showNut: Math.random() < 0.3, rotX: 0, rotY: 0, rotZ: 0,
  });
  state.length = Math.round(state.d * (2 + Math.random() * 7));
  state.tip = state.profile === 'wood' ? 'point' : 'chamfer';
  if (state.profile === 'wood') state.showNut = false;
  state.rough = FINISHES[state.finish].rough;
  activePreset = ''; syncUI(); rebuild(); fitView();
};

syncUI(); resize(); rebuild(); fitView();
// bring back the last uploaded engraving image, if any
try {
  const saved = JSON.parse(localStorage.getItem(ENG_KEY) || 'null');
  if (saved && saved.src) loadEngraving(saved.src, saved.name, () => { syncUI(); if (state.drive === 'custom') rebuild(); });
} catch {}
